kind: pipeline
type: docker
name: checks

trigger:
  event:
    - push
    - pull_request
    - tag

steps:
  - name: checks
    image: alpine/git
    commands:
      - sh .drone/checks.sh

  - name: publish
    image: alpine/git
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - sh .drone/publish.sh Stenopos/std
    depends_on:
      - checks
    when:
      event:
        - push
      branch:
        - main
